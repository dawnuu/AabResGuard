import java.security.MessageDigest
import java.net.HttpURLConnection
import java.net.URL
import java.net.URLEncoder
import java.nio.charset.StandardCharsets
import java.util.Base64
import java.util.Locale

// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    apply from: rootProject.file("gradle/config.gradle")
    repositories {
        google()
        mavenCentral()
        maven { url "https://repo.grails.org/grails/core/" }
        mavenLocal()
        gradlePluginPortal()
    }
    dependencies {
        classpath "com.gradleup.shadow:shadow-gradle-plugin:8.3.0"
        classpath "com.android.tools.build:gradle:8.13.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21"
        classpath "com.google.protobuf:protobuf-gradle-plugin:0.9.4"
        classpath "digital.wup:android-maven-publish:3.6.3"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://repo.grails.org/grails/core/" }
        mavenLocal()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

def centralVersion = VERSION.toString()
def centralGroupPath = GROUP_ID.toString().replace('.', '/')
def centralPluginId = PLUGIN_ID.toString()
def resolveCentralProperty = { String propertyName, String environmentName ->
    def projectValue = findProperty(propertyName)
    if (projectValue != null && projectValue.toString().trim()) {
        return projectValue.toString().trim()
    }
    def systemValue = System.getProperty(propertyName)
    if (systemValue != null && systemValue.trim()) {
        return systemValue.trim()
    }
    def environmentValue = System.getenv(environmentName)
    if (environmentValue != null && environmentValue.trim()) {
        return environmentValue.trim()
    }
    return null
}
def centralDeploymentName = {
    resolveCentralProperty('centralDeploymentName', 'MAVEN_CENTRAL_DEPLOYMENT_NAME')
            ?: "aabresguard-${centralVersion}"
}
def centralPublishingType = {
    def publishingType = (resolveCentralProperty('centralPublishingType', 'MAVEN_CENTRAL_PUBLISHING_TYPE')
            ?: 'USER_MANAGED').toUpperCase(Locale.ROOT)
    if (!(publishingType in ['AUTOMATIC', 'USER_MANAGED'])) {
        throw new GradleException('centralPublishingType must be AUTOMATIC or USER_MANAGED.')
    }
    return publishingType
}
def centralArtifactCoordinates = [
        [groupPath: centralGroupPath, artifactId: 'aabresguard-core'],
        [groupPath: centralGroupPath, artifactId: 'aabresguard-plugin'],
        [groupPath: centralPluginId.replace('.', '/'), artifactId: "${centralPluginId}.gradle.plugin"]
]
def localMavenRepository = file("${System.getProperty('user.home')}/.m2/repository")

def centralReleaseEnabled = {
    def value = findProperty('centralRelease') ?: System.getProperty('centralRelease') ?: System.getenv('MAVEN_CENTRAL_RELEASE')
    value?.toString()?.toBoolean() ?: false
}

def centralArtifactDirectories = {
    centralArtifactCoordinates.collect { coordinates ->
        file("${localMavenRepository}/${coordinates.groupPath}/${coordinates.artifactId}/${centralVersion}")
    }
}

def centralChecksumCandidates = { File artifactDirectory ->
    artifactDirectory.listFiles()?.findAll { File artifactFile ->
        artifactFile.isFile()
                && !artifactFile.name.endsWith('.module')
                && !artifactFile.name.endsWith('.asc')
                && !artifactFile.name.endsWith('.md5')
                && !artifactFile.name.endsWith('.sha1')
                && !artifactFile.name.endsWith('.sha256')
                && !artifactFile.name.endsWith('.sha512')
                && !artifactFile.name.startsWith('maven-metadata')
    } ?: []
}

def writeChecksum = { File artifactFile, String algorithm, String extension ->
    MessageDigest digest = MessageDigest.getInstance(algorithm)
    artifactFile.withInputStream { inputStream ->
        byte[] buffer = new byte[8192]
        int readCount = inputStream.read(buffer)
        while (readCount >= 0) {
            if (readCount > 0) {
                digest.update(buffer, 0, readCount)
            }
            readCount = inputStream.read(buffer)
        }
    }
    String checksum = digest.digest().collect { byteValue ->
        String.format('%02x', byteValue & 0xff)
    }.join()
    file("${artifactFile.absolutePath}.${extension}").text = checksum + System.lineSeparator()
}

tasks.register('generateCentralChecksums') {
    dependsOn(':core:publishToMavenLocal', ':plugin:publishToMavenLocal')
    doLast {
        if (!centralReleaseEnabled()) {
            throw new GradleException('Set -PcentralRelease=true before creating a Maven Central bundle.')
        }
        centralArtifactDirectories().each { artifactDirectory ->
            if (!artifactDirectory.isDirectory()) {
                throw new GradleException("Missing local publication directory: ${artifactDirectory}")
            }
            centralChecksumCandidates(artifactDirectory).each { artifactFile ->
                writeChecksum(artifactFile, 'MD5', 'md5')
                writeChecksum(artifactFile, 'SHA-1', 'sha1')
                writeChecksum(artifactFile, 'SHA-256', 'sha256')
                writeChecksum(artifactFile, 'SHA-512', 'sha512')
            }
            def unsignedFiles = centralChecksumCandidates(artifactDirectory).findAll { artifactFile ->
                !file("${artifactFile.absolutePath}.asc").isFile()
            }
            if (!unsignedFiles.isEmpty()) {
                throw new GradleException("Missing GPG signatures in ${artifactDirectory}: ${unsignedFiles*.name.join(', ')}")
            }
        }
    }
}

tasks.register('centralPortalBundle', Zip) {
    dependsOn('generateCentralChecksums')
    archiveFileName = "aabresguard-${centralVersion}-central-bundle.zip"
    destinationDirectory = layout.buildDirectory.dir('central')
    centralArtifactCoordinates.each { coordinates ->
        from({ file("${localMavenRepository}/${coordinates.groupPath}/${coordinates.artifactId}/${centralVersion}") }) {
            into("${coordinates.groupPath}/${coordinates.artifactId}/${centralVersion}")
            include('*.jar', '*.pom', '*.asc', '*.md5', '*.sha1', '*.sha256', '*.sha512')
            exclude('*.module*')
        }
    }
}

tasks.register('centralPortalUpload') {
    dependsOn('centralPortalBundle')
    doLast {
        def username = resolveCentralProperty('mavenCentralUsername', 'MAVEN_CENTRAL_USERNAME')
        def password = resolveCentralProperty('mavenCentralPassword', 'MAVEN_CENTRAL_PASSWORD')
        if (username == null || password == null) {
            throw new GradleException('Set mavenCentralUsername/mavenCentralPassword or MAVEN_CENTRAL_USERNAME/MAVEN_CENTRAL_PASSWORD before uploading.')
        }

        def bundleFile = tasks.named('centralPortalBundle', Zip).get().archiveFile.get().asFile
        if (!bundleFile.isFile()) {
            throw new GradleException("Missing Maven Central bundle: ${bundleFile}")
        }

        def deploymentName = centralDeploymentName()
        def publishingType = centralPublishingType()
        def encodedName = URLEncoder.encode(deploymentName, StandardCharsets.UTF_8.name())
        def uploadUrl = new URL("https://central.sonatype.com/api/v1/publisher/upload?name=${encodedName}&publishingType=${publishingType}")
        def connection = (HttpURLConnection) uploadUrl.openConnection()
        def boundary = "----AabResGuard${System.currentTimeMillis()}"
        def authorization = Base64.encoder.encodeToString(
                "${username}:${password}".getBytes(StandardCharsets.UTF_8)
        )

        connection.requestMethod = 'POST'
        connection.doOutput = true
        connection.connectTimeout = 30_000
        connection.readTimeout = 120_000
        connection.setChunkedStreamingMode(0)
        connection.setRequestProperty('Authorization', "Bearer ${authorization}")
        connection.setRequestProperty('Content-Type', "multipart/form-data; boundary=${boundary}")

        try {
            connection.outputStream.withCloseable { outputStream ->
                def writer = new OutputStreamWriter(outputStream, StandardCharsets.UTF_8)
                writer.write("--${boundary}\r\n")
                writer.write("Content-Disposition: form-data; name=\"bundle\"; filename=\"${bundleFile.name}\"\r\n")
                writer.write("Content-Type: application/octet-stream\r\n\r\n")
                writer.flush()
                bundleFile.withInputStream { inputStream ->
                    byte[] buffer = new byte[8192]
                    int readCount
                    while ((readCount = inputStream.read(buffer)) != -1) {
                        outputStream.write(buffer, 0, readCount)
                    }
                }
                writer.write("\r\n--${boundary}--\r\n")
                writer.flush()
            }

            def responseCode = connection.responseCode
            def responseStream = responseCode >= 400 ? connection.errorStream : connection.inputStream
            def response = responseStream == null ? '' : responseStream.getText(StandardCharsets.UTF_8.name()).trim()
            if (responseCode < 200 || responseCode >= 300) {
                throw new GradleException("Maven Central upload failed (${responseCode}): ${response}")
            }
            logger.lifecycle("Maven Central deployment uploaded: ${deploymentName} (${publishingType}), ID: ${response}")
        } finally {
            connection.disconnect()
        }
    }
}
