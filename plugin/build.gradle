import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: 'java-library'
apply plugin: 'kotlin'
apply plugin: "groovy"
apply plugin: 'java-gradle-plugin'
apply from: rootProject.file('gradle/publish_plugin.gradle')

gradlePlugin {
    plugins {
        aabResGuard {
            id = 'com.bytedance.android.aabResGuard'
            implementationClass = 'com.bytedance.android.plugin.AabResGuardPlugin'
        }
    }
}

configurations.all {
    resolutionStrategy {
        force "com.android.tools.build:gradle:7.4.0"
        force "com.android.tools.build:gradle-api:7.4.0"
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation gradleApi()
    implementation localGroovy()
    compileOnly "com.android.tools.build:gradle:8.13.2"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.0.21"
    implementation "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21"
    
    api(project(":core")) {
        exclude group: "com.google.guava", module: "guava"
        exclude group: "com.android.tools.build", module: "gradle"
    }
}

configurations {
    all*.exclude group: "com.android.tools.build", module: "bundletool"
}

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}
