apply plugin: 'java-library'
apply plugin: "com.google.protobuf"
apply plugin: "com.github.johnrengelman.shadow"
apply from: rootProject.file('gradle/publish_core.gradle')

[compileJava, compileTestJava, javadoc]*.options*.encoding = 'UTF-8'

configurations.all {
    resolutionStrategy.dependencySubstitution {
        resolutionStrategy {
            force "com.android.tools.build:bundletool:0.13.3"
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    compileOnly "com.android.tools.build:aapt2-proto:4.2.2-7147631"
    compileOnly gradleApi()

    implementation "com.android.support:support-annotations:28.0.0"
    shadow 'commons-io:commons-io:2.11.0'
    shadow 'commons-codec:commons-codec:1.15'
    shadow "com.google.guava:guava:31.1-jre"

    annotationProcessor "com.google.auto.value:auto-value:1.5.4"
    implementation "com.google.auto.value:auto-value:1.5.4"
    shadow group: 'org.dom4j', name: 'dom4j', version: '2.1.4'
    shadow "com.android.tools.build:bundletool:0.13.3"
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.21.12"
    }
}

shadowJar {
    baseName = "AabResGuard"
    version = VERSION
    classifier = ''

    minimize()

    from sourceSets.main.output
    configurations = [
            project.configurations.shadow
    ]
    manifest {
        attributes 'Main-Class': 'com.bytedance.android.aabresguard.AabResGuardMain'
    }
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'

    relocate 'com.android', 'shadow.bytedance.com.android'
    relocate 'com.google', 'shadow.bytedance.com.google'
}
