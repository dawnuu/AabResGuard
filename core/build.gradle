apply plugin: 'java-library'
apply plugin: "com.google.protobuf"
apply plugin: "com.gradleup.shadow"
apply from: rootProject.file('gradle/publish_core.gradle')
apply from: rootProject.file('gradle/publish_common.gradle')

[compileJava, compileTestJava, javadoc]*.options*.encoding = 'UTF-8'

configurations.all {
    resolutionStrategy.dependencySubstitution {
        resolutionStrategy {
            force "com.android.tools.build:bundletool:1.18.3"
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    compileOnly "com.android.tools.build:aapt2-proto:7.3.0-8691043"
    compileOnly gradleApi()

    implementation "com.google.protobuf:protobuf-java:4.29.3"
    implementation "androidx.annotation:annotation:1.9.1"
    shadow 'commons-io:commons-io:2.18.0'
    shadow 'commons-codec:commons-codec:1.17.2'
    shadow "com.google.guava:guava:33.4.0-jre"

    annotationProcessor "com.google.auto.value:auto-value:1.5.4"
    implementation "com.google.auto.value:auto-value:1.5.4"
    shadow group: 'org.dom4j', name: 'dom4j', version: '2.1.4'
    shadow "com.android.tools.build:bundletool:1.18.3"
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:4.29.3"
    }
}

shadowJar {
    archiveBaseName = "AabResGuard"
    archiveVersion = VERSION
    archiveClassifier = ''

    minimize()

    from sourceSets.main.output
    configurations = [
            project.configurations.shadow
    ]
    manifest {
        attributes 'Main-Class': 'com.bytedance.android.aabresguard.AabResGuardMain'
    }
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'

    relocate 'com.android', 'shadow.bytedance.com.android'
    relocate 'com.google', 'shadow.bytedance.com.google'
}
